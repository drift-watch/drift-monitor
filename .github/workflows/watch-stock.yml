name: Surveillance stock GA-110PKM-7A

on:
  schedule:
    # Toutes les 5 minutes (minimum garanti par GitHub Actions - en dessous
    # de 5 min, les executions ne sont pas fiables et sont souvent ignorees).
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write # necessaire pour committer state.json

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Verifier le stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_stock.py

      - name: Sauvegarder l'etat (state.json)
        run: |
          if [ -f state.json ]; then
            git config user.name "stock-watch-bot"
            git config user.email "actions@github.com"
            git add state.json
            git diff --staged --quiet || git commit -m "Mise a jour statut stock [skip ci]"
            git push
          else
            echo "state.json non cree (statut ambigu cette fois), rien a committer."
          fi
